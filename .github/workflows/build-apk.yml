name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Download & Extract Capacitor CLI
        run: |
          mkdir app && cd app
          cat << 'EOF' > package.json
          {
            "name": "awash7market",
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/core": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/android": "^6.0.0",
              "@capacitor/assets": "^3.0.0"
            }
          }
          EOF
          npm install

      - name: Initialize App Project, Set Icon & Server URL
        run: |
          cd app
          npx cap init "Awash 7 Kilo VMC" "com.awash7kilovmc.app" --web-dir "www"
          mkdir www
          echo "<h1>Loading...</h1>" > www/index.html
          
          # Inject direct server URL configuration into capacitor.config.json
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.awash7kilovmc.app",
            "appName": "awash7market",
            "webDir": "www",
            "server": {
              "url": "https://awash7kilovmc.base44.app",
              "cleartext": true
            }
          }
          EOF
          
          npx cap add android

          # Automatically copy icon.png and generate custom launcher icons using the correct syntax
          if [ -f ../icon.png ]; then
            mkdir -p assets
            cp ../icon.png assets/icon.png
            npx @capacitor/assets generate --android
          fi

      - name: Build Debug APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: awash7market-App
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
