name: Build Android App (APK & Signed AAB)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android App Project
        run: |
          mkdir app && cd app
          
          # Initialize package manifest
          cat << 'EOF' > package.json
          {
            "name": "awash7-market",
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/core": "^6.0.0",
              "@capacitor/cli": "^6.0.0",
              "@capacitor/android": "^6.0.0"
            }
          }
          EOF
          
          npm install

          # Initialize Capacitor with app name "Awash7 Market"
          npx cap init "Awash7 Market" "com.awash7market.app" --web-dir "www"
          mkdir www
          echo "<html><body style='margin:0;background:#000;'><h2 style='color:#fff;text-align:center;margin-top:40vh;'>Loading Awash7 Market...</h2></body></html>" > www/index.html

          # Configure site URL
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.awash7market.app",
            "appName": "Awash7 Market",
            "webDir": "www",
            "server": {
              "url": "https://awash7kilovmc.base44.app",
              "cleartext": true
            }
          }
          EOF

          # Generate native Android project shell and sync settings
          npx cap add android
          npx cap sync android

          # Make Gradle executable inside the app/android directory
          cd android
          chmod +x gradlew
          chmod +x gradle/wrapper/gradle-wrapper.jar || true
          
          # Build APK for testing
          ./gradlew assembleDebug
          
          # Build Release Bundle for Google Play Store
          ./gradlew bundleRelease
          
          # Sign Release AAB File
          keytool -genkeypair -v -keystore release.keystore -alias awashkey -keyalg RSA -keysize 2048 -validity 10000 -storepass awashpass -keypass awashpass -dname "CN=Awash7Market, OU=App, O=Awash7Market, L=Awash, C=ET"
          jarsigner -keystore release.keystore -storepass awashpass -keypass awashpass app/build/outputs/bundle/release/app-release-unsigned.aab awashkey
          mv app/build/outputs/bundle/release/app-release-unsigned.aab app/build/outputs/bundle/release/Awash7Market-signed.aab

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Awash7Market-App-Files
          path: |
            app/android/app/build/outputs/apk/debug/app-debug.apk
            app/android/app/build/outputs/bundle/release/Awash7Market-signed.aab
